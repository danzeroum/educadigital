[project]
name = "educadigital-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",

    # Cache & Queue
    "redis[asyncio]>=5.2.1",
    "celery[redis]>=5.4.0",

    # Auth
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # AI & ML
    "anthropic>=0.40.0",
    "openai>=1.58.0",
    "langchain>=0.3.14",
    "langchain-anthropic>=0.3.3",
    "langchain-openai>=0.3.0",
    "faiss-cpu>=1.9.0",

    # OCR & Document Processing
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "PyMuPDF>=1.25.0",

    # ML (risk prediction)
    "lightgbm>=4.5.0",
    "scikit-learn>=1.6.0",
    "numpy>=2.2.0",
    "pandas>=2.2.3",

    # HTTP Client (connectors)
    "httpx>=0.28.1",
    "yt-dlp>=2024.12.23",

    # PDF generation
    "reportlab>=4.3.0",
    "qrcode[pil]>=8.0",

    # Validation
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",

    # Observability
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Utils
    "python-dotenv>=1.0.1",
    "boto3>=1.35.88",
    "phonenumbers>=8.13.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "factory-boy>=3.3.1",
    "ruff>=0.8.6",
    "mypy>=1.14.0",
]


[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
